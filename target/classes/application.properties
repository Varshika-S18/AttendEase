spring.application.name=AttendEase
server.port=8080

# H2 file database (data survives restarts). Console: http://localhost:8080/h2-console
spring.datasource.url=jdbc:h2:file:./data/attendease
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# AttendEase settings
attendease.min-threshold=75
attendease.faculty-api-key=faculty123
attendease.seed-demo=true

springdoc.swagger-ui.path=/swagger-ui.html
